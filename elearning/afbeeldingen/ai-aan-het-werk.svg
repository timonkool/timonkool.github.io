<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Een stapel documenten met een vinkje: werken met je eigen materiaal">
  <!-- Niveau 2, AI aan het werk. Vlakke kleuren uit de Saliegroene rust, geen verloop. -->
  <rect width="600" height="600" fill="#eef2ec"/>

  <!-- Rustige heuvels onderaan -->
  <path d="M0 470 Q 150 420 300 456 T 600 436 V600 H0 Z" fill="#c8d4c4"/>
  <path d="M0 536 Q 180 498 340 526 T 600 510 V600 H0 Z" fill="#8ba287"/>

  <!-- Alles samen iets kleiner, zodat het ook in de smalle kaartuitsnede past -->
  <g transform="translate(300 304) scale(0.9) translate(-300 -290)">
    <!-- Twee vellen op de achtergrond: je eigen bronmateriaal -->
    <g transform="rotate(-9 300 290)">
      <rect x="146" y="122" width="236" height="296" rx="22" fill="#c8d4c4"/>
    </g>
    <g transform="rotate(7 300 290)">
      <rect x="224" y="116" width="236" height="296" rx="22" fill="#8ba287"/>
    </g>

    <!-- Het document zelf -->
    <rect x="182" y="138" width="244" height="300" rx="24" fill="#ffffff"/>
    <rect x="214" y="178" width="112" height="16" rx="8" fill="#5d7059"/>
    <rect x="214" y="216" width="180" height="11" rx="5.5" fill="#c8d4c4"/>
    <rect x="214" y="241" width="158" height="11" rx="5.5" fill="#c8d4c4"/>
    <rect x="214" y="266" width="180" height="11" rx="5.5" fill="#c8d4c4"/>
    <rect x="214" y="291" width="124" height="11" rx="5.5" fill="#c8d4c4"/>
    <rect x="214" y="328" width="180" height="62" rx="14" fill="#eef2ec"/>
    <rect x="232" y="347" width="104" height="10" rx="5" fill="#8ba287"/>
    <rect x="232" y="367" width="72" height="10" rx="5" fill="#8ba287"/>

    <!-- Vinkje: het document is af -->
    <circle cx="408" cy="412" r="46" fill="#5d7059"/>
    <path d="M385 413 L402 430 L433 394" fill="none" stroke="#faf8f4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
